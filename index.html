<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intercom Integration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    
    .bg-container {
      position: relative;
      min-height: 100vh;
      background-color: #e9dfd1; /* Light beige fallback */
      background-image: url("/assets/geometric-abstract.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    
    .blur-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2;
    }
    
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #333;
      max-width: 800px;
      padding: 2rem;
    }
    
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    
    #debug-info {
      position: fixed;
      bottom: 10px;
      left: 10px;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      z-index: 9999;
      max-width: 80%;
    }
  </style>
</head>
<body>
  <div class="bg-container">
    <div class="blur-overlay"></div>
    <div class="content">
      <h1>Welcome</h1>
      <p>Click the icon in the bottom right to open the Intercom Messenger.</p>
    </div>
  </div>
  
  <div id="debug-info"></div>

  <!-- Intercom Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intercom-messenger-js-sdk/0.1.0/messenger.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Debug information
      const debugInfo = document.getElementById('debug-info');
      debugInfo.innerHTML = 'Debug Info:<br>';
      debugInfo.innerHTML += 'Page URL: ' + window.location.href + '<br>';
      debugInfo.innerHTML += 'Image path: /assets/geometric-abstract.png<br>';
      
      // Test if background image loaded
      const img = new Image();
      img.onload = function() {
        debugInfo.innerHTML += 'Background image loaded successfully!<br>';
        debugInfo.style.backgroundColor = 'rgba(0, 128, 0, 0.7)';
      };
      img.onerror = function() {
        debugInfo.innerHTML += 'Failed to load background image!<br>';
        // Try alternative paths
        debugInfo.innerHTML += 'Trying alternative paths...<br>';
        testImagePath('./assets/geometric-abstract.png');
        testImagePath('assets/geometric-abstract.png');
        testImagePath('../assets/geometric-abstract.png');
        testImagePath('/yourrepository/assets/geometric-abstract.png');
      };
      img.src = '/assets/geometric-abstract.png';
      
      function testImagePath(path) {
        const testImg = new Image();
        testImg.onload = function() {
          debugInfo.innerHTML += 'Success with: ' + path + '<br>';
          document.querySelector('.bg-container').style.backgroundImage = 'url("' + path + '")';
        };
        testImg.onerror = function() {
          debugInfo.innerHTML += 'Failed with: ' + path + '<br>';
        };
        testImg.src = path;
      }
      
      // Initialize Intercom with the new app_id
      if (typeof Intercom === 'function') {
        Intercom({
          app_id: 'q44qconr'
        });
      } else {
        debugInfo.innerHTML += 'Intercom SDK not loaded properly<br>';
      }
    });
  </script>
</body>
</html>
