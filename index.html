<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generic Workspace Demo</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: white;
    }
  </style>
</head>
<body>
  <!-- Intercom Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intercom-messenger-js-sdk/0.1.0/messenger.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize Intercom with the app_id
      if (typeof Intercom === 'function') {
        Intercom({
          app_id: 'q44qconr'
        });
      }
    });
  </script>
</body>
</html>
