<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intercom Integration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    
    .bg-container {
      position: relative;
      min-height: 100vh;
      background-color: #f5f1e6; /* Fallback background color matching the image base */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    
    .blur-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2;
    }
    
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #333;
      max-width: 800px;
      padding: 2rem;
    }
    
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="bg-container">
    <img src="./assets/geometric-abstract.png" alt="Abstract geometric shapes in orange, yellow, teal and navy" class="bg-image">
    <div class="blur-overlay"></div>
    <div class="content">
      <h1>Welcome</h1>
      <p>Click the icon in the bottom right to open the Intercom Messenger.</p>
    </div>
  </div>

  <!-- Intercom Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intercom-messenger-js-sdk/0.1.0/messenger.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize Intercom with the new app_id
      if (typeof Intercom === 'function') {
        Intercom({
          app_id: 'q44qconr'
        });
      } else {
        console.error('Intercom SDK not loaded properly');
      }
    });
  </script>
</body>
</html>
